name: CodeQL

# GitHub's own code scanning for the Node.js service. Results appear in the Security tab. It runs next
# to Semgrep (validate.yml), which stays the required check; this one is additional and not required.
# Fully offline: no AWS credentials are used.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'product-service/**'
      - '.github/workflows/codeql.yml'
  push:
    branches:
      - main
    paths:
      - 'product-service/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analysis (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript

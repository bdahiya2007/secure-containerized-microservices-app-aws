# CodeDeploy blue/green for ECS. The deploy workflow replaces <TASK_DEFINITION> with the ARN of the
# task definition revision it just registered, then passes this file to `aws deploy create-deployment`.
# ContainerName and ContainerPort must match the load_balancer block of the ECS service (terraform/codedeploy.tf).
version: 0.0
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: <TASK_DEFINITION>
        LoadBalancerInfo:
          ContainerName: product-service
          ContainerPort: 3000
